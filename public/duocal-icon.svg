<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DuoCal Icon</title>
  <desc id="desc">Ícone do DuoCal com calendário compartilhado, duas pessoas e coração.</desc>

  <defs>
    <linearGradient id="duocalGradient" x1="18" y1="18" x2="142" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5466F1"/>
      <stop offset="1" stop-color="#B66DFF"/>
    </linearGradient>

    <linearGradient id="softGradient" x1="42" y1="46" x2="118" y2="126" gradientUnits="userSpaceOnUse">
