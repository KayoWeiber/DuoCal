name: Deploy DuoCal to GitHub Pages

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: duocal-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DuoCal
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm install

      - name: Criar .env.production
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production
          echo "VITE_APP_VERSION=${{ secrets.VITE_APP_VERSION }}" >> .env.production

      - name: Reservar versao de producao
        id: version
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run version:prod

      - name: Build Pull Request
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Build Producao
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm run build:prod

      - name: Upload artifact GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Ativar versao no banco
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DUOCAL_DEPLOY_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          test -n "$DUOCAL_DEPLOY_VERSION"
          curl --fail --request POST "$VITE_SUPABASE_URL/rest/v1/rpc/rpc_ativar_versao_aplicacao" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "{
              \"p_cd_versao\": \"$DUOCAL_DEPLOY_VERSION\",
              \"p_ds_versao\": \"Deploy publicado no GitHub Pages\",
              \"p_fl_bloqueia_versoes_antigas\": true
            }"
